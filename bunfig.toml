# Bun configuration file

[install]
# Minimum release age for packages (supply-chain guard). 2 days — blocks
# installs of versions published within the last 48h so freshly compromised
# releases have time to be flagged and yanked.
minimumReleaseAge = 172800
# `aelea` is the in-house FRP framework; we publish + consume same-day
# during active development, so the age gate would block our own releases.
minimumReleaseAgeExcludes = ["aelea"]
# Isolated workspace installs (Bun 1.3+).
linkBehavior = "isolated"

[test]
coverage = true

[run]
# Monorepo with a committed lockfile — don't let `bun run` silently add deps.
# Use explicit `bun install` at the workspace root instead.
autoInstall = false
telemetry = false