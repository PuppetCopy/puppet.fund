# Full reference https://github.com/foundry-rs/foundry/tree/master/config

[profile.default]
  src = "src"
  script = "script/deploy"
  out = "forge-artifacts"
  cache_path = "forge-cache"
  libs = ["lib"]
  ignored_error_codes = [2424, 4591]  # Suppress deprecated natspec memory-safe-assembly and "more than 256 warnings" warnings
  ignored_warnings_from = ["test", "lib"]  # Silence solc warnings from test fixtures and vendored libs; src/ + script/ stay verbose
  fs_permissions = [
    { access = "read-write", path = "./deployments.toml" },
    { access = "read", path = "./const.toml" },
    { access = "read-write", path = "./broadcast" },
    { access = "read", path = "./forge-artifacts-prod" }
  ]
  remappings = [
    "forge-std/=lib/forge-std/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
  ]
  evm_version = "prague"
  solc_version = "0.8.36"
  via_ir = true
  bytecode_hash = "none"
  cbor_metadata = false
  optimizer = true
  optimizer_runs = 200
  gas_reports = [
    "SpokeGate",
    "HubGate"
  ]

[profile.default.optimizer_details]
  yul = true

[profile.default.optimizer_details.yulDetails]
  stackAllocation = true

[profile.default.fuzz]
  max_test_rejects = 1_000_000 # Number of times `vm.assume` can fail
  runs = 256

[profile.prod]
  out = "forge-artifacts-prod"
  cache_path = "forge-cache-prod"
  optimizer_runs = 1_000

# Under via_ir the whole compilation unit decides a contract's bytecode, so
# script/ and test/ are pinned to their own harness profile: without it foundry
# merges same-settings files into one unit, baking forge-std/scripts into the
# deployed bytecode and its verification input. The cost is that every src
# contract gets a second <Name>.harness.json artifact from the test/script units,
# so Deploy._creationCode must load the PROD ARTIFACT BY PATH: both
# type(X).creationCode and a bare "File.sol:Name" qualifier resolve to the 1-run
# harness build (v12 and v13 each shipped a whole universe of harness bytecode
# that way).
[[profile.prod.additional_compiler_profiles]]
  name = "harness"
  optimizer_runs = 1

[[profile.prod.compilation_restrictions]]
  paths = "script/**"
  max_optimizer_runs = 1

[[profile.prod.compilation_restrictions]]
  paths = "test/**"
  max_optimizer_runs = 1

[profile.ci.fuzz]
  runs = 1000

[fmt]
  line_length = 120
  tab_width = 4
  bracket_spacing = false
  quote_style = "double"
  number_underscore = "thousands"
  int_types = "short"
  multiline_func_header = "params_first"
  wrap_comments = true
  sort_imports = false

[doc]
  # Hide ABI-internal helpers and interface boilerplate.
  # Error.sol stays surfaced — its custom errors are part of the public ABI
  # (clients decode reverts via the puppetErrorAbi export).
  ignore = [
    "**/interface/**/*.sol",
    "**/shared/**/*.sol",
    "src/utils/auth/**/*.sol",
    "src/utils/TransferUtils.sol",
    "src/utils/IntentLib.sol"
  ]

[lint]
  # Test files are excluded; src/ + script/ stay verbose.
  exclude_paths = ["test/**"]
  # Stylistic / informational — pure noise during build.
  # Suppressing as substantive choices, not pure style:
  #   unsafe-cheatcode       — cheatcodes are test-only; vm.* uses live in fixtures.
  #   erc20-unchecked-transfer — we route ERC20 through TransferUtils.transferStrictly.
  #   unsafe-typecast        — false positives on bytes32("…") literal fixtures.
  exclude_lints = [
    "screaming-snake-case-immutable",
    "screaming-snake-case-const",
    "mixed-case-variable",
    "mixed-case-function",
    "unused-import",
    "asm-keccak256",
    "unsafe-cheatcode",
    "erc20-unchecked-transfer",
    "unsafe-typecast"
  ]

[rpc_endpoints]
  arbitrum = { url = "${RPC_URL}/arbitrum/${RPC_KEY}", chain_id = 42161 }
  optimism = { url = "${RPC_URL}/optimism/${RPC_KEY}", chain_id = 10 }

[etherscan]
  arbitrum = { key = "${ETHERSCAN_API_KEY}" }
  optimism = { key = "${ETHERSCAN_API_KEY}" }
