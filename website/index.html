<!DOCTYPE html>
<html lang="en">

<head>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>__APP_NAME__</title>
    <meta name="description" content="__APP_DESC_LONG__">
    <meta name="theme-color" content="__THEME_BG_LIGHT__" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="__THEME_BG_DARK__" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="__APP_NAME__">
    <link rel="preload" href="./src/assets/font/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./src/assets/font/PuppetNumbers.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" href="./public/favicon.ico" sizes="48x48">
    <link rel="icon" href="./public/favicon.svg" sizes="any" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./public/assets/pwa/apple-180x180.png">

    <style>
        :root {
            --font: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --font-numbers: 'Puppet Numbers', var(--font);
            --text-sm: 1rem;
            --text-xxl: 1.45rem;
            --hairline: 1px;
        }

        @media (min-resolution: 1.5dppx) {
            :root {
                --hairline: 0.5px;
            }
        }

        @media (min-resolution: 2.5dppx) {
            :root {
                --hairline: 0.3333px;
            }
        }

        * {
            box-sizing: border-box;
        }

        html {
            text-rendering: geometricPrecision;
            scrollbar-gutter: stable;
        }

        body {
            margin: 0;
            background-color: __THEME_BG_LIGHT__;
            scrollbar-gutter: stable;
        }

        [popover] {
            scrollbar-width: thin;
            scrollbar-color: color-mix(in srgb, var(--foreground) 50%, transparent) transparent;
        }

        [popover] > * {
            max-width: 100%;
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            appearance: none;
        }

        input[type="number"] {
            appearance: none;
        }

        html {
            font-family: var(--font);
            font-feature-settings: "tnum" on, "lnum" on, "calt" off;
            font-variant-ligatures: no-contextual;
            font-synthesis: none;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit;
        }

        a {
            text-decoration-line: underline;
            text-decoration-color: color-mix(in srgb, var(--foreground) 35%, transparent);
            text-underline-offset: 3px;
        }

        @font-face {
            font-family: 'Inter';
            src: url("/src/assets/font/InterVariable.woff2") format('woff2');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Puppet Numbers';
            src: url("/src/assets/font/PuppetNumbers.woff2") format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
            unicode-range: U+0024-0025, U+002C-002E, U+0030-0039, U+2212;
        }

        @font-face {
            font-family: 'Inter';
            src: url("/src/assets/font/InterVariable.woff2") format('woff2');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
            unicode-range: U+0024;
            size-adjust: 62%;
        }

        @font-face {
            font-family: 'Puppet Numbers';
            src: url("/src/assets/font/PuppetNumbers.woff2") format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
            unicode-range: U+0024;
            size-adjust: 62%;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes spinnerSpring {
            0% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(100deg);
            }

            50% {
                transform: rotate(170deg);
            }

            75% {
                transform: rotate(280deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        @keyframes signal {
            0% {
                transform: scale(0.7);
                opacity: 0.8;
            }

            100% {
                transform: scale(2.4);
                opacity: 0;
            }
        }

        @keyframes promptIn {
            from {
                transform: translateY(16px);
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            @keyframes promptIn {
                from {
                    opacity: 0;
                }
            }
        }
    </style>

    <style id="aelea-theme-config">
        body.light {
            --name: 'light';
            --primary: #870B38;
            --message: #171B1F;
            --background: #e0e4ea;
            --horizon: #d1d8e2;
            --middleground: #ffffff;
            --foreground: #425169;
            --positive: #006630;
            --negative: #b30b19;
            --indeterminate: #934003;
            --shade-pole: var(--background);
            --shadow: rgb(59 60 74 / 20%);
            --card-shadow: rgb(0 0 0 / 25%) 0px 0px 1px, rgb(59 60 74 / 15%) 0px 15px 20px, rgb(0 0 0 / 8%) 0px 1px 12px;
        }

        body.dark {
            --name: 'dark';
            --primary: #964565;
            --message: #ffffff;
            --background: #101217;
            --horizon: #292c37;
            --middleground: #1d202b;
            --foreground: #94a4c2;
            --positive: #38E567;
            --negative: #ff6050;
            --indeterminate: #ffc000;
            --shade-pole: var(--background);
            --shadow: rgb(0 0 0 / 45%);
            --card-shadow: rgb(0 0 0 / 25%) 0px 0px 1px, rgb(0 0 0 / 15%) 0px 15px 20px, rgb(0 0 0 / 8%) 0px 1px 12px;
        }
    </style>

    <meta property="og:image" content="__OG_IMAGE__">
    <meta property="og:image:type" content="image/png">

    <meta name="twitter:image:src" content="__OG_IMAGE__">

    <meta name="twitter:description" content="__APP_DESC_LONG__">

</head>

</body>

</html>
